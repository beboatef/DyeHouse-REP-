name: CI

# The repository's own verification story, run on every push and pull request:
#   backend    - Release build + the 1007 domain tests (no database needed);
#   integration- the API suite against a real SQL Server, because the numbering engine uses
#                sp_getapplock and has no in-memory equivalent;
#   frontend   - typecheck, lint, production build, i18n key parity and the structural sweeps in tools/.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # global.json pins the 9.0.3xx feature band; 9.0.x resolves inside it.
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore DyeHouseERP.sln

      - name: Build (Release)
        run: dotnet build DyeHouseERP.sln -c Release --no-restore

      - name: Unit tests
        run: >
          dotnet test tests/DyeHouseERP.UnitTests/DyeHouseERP.UnitTests.csproj
          -c Release --no-build --nologo

  integration:
    name: Integration tests (real SQL Server)
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          # This password protects a throwaway container that lives for one CI job; it is not a
          # deployment credential and nothing outside this file uses it.
          MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      # The suite DROPS and recreates this database per test class: never point it at real data.
      DYEHOUSE_TEST_CONNECTION: "Server=127.0.0.1,1433;Database=DyeHouseERP_IntegrationTests;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;Connect Timeout=30;"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Wait for SQL Server
        # The runner starts the step as soon as the container is running, not when it is ready: the
        # port opens first and the engine accepts logins a little later.
        run: |
          for _ in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/1433) 2>/dev/null; then
              echo "SQL Server port 1433 is open"
              break
            fi
            sleep 2
          done
          sleep 20

      - name: Integration tests
        run: >
          dotnet test tests/DyeHouseERP.IntegrationTests/DyeHouseERP.IntegrationTests.csproj
          --nologo

  frontend:
    name: Frontend typecheck, lint, build, i18n
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/DyeHouseERP.Web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/DyeHouseERP.Web/package-lock.json

      # `npm ci` (never `npm install`): the lockfile is the contract, and a drifted tree must fail here.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: npx eslint .

      - name: Build
        run: npm run build

      - name: i18n key parity
        working-directory: .
        run: node tools/i18n-parity-check.cjs

      - name: Structural sweeps
        # These read the repository from its root (and reuse the frontend's typescript package).
        working-directory: .
        run: |
          node tools/hooks-check.js
          node tools/wiring-sweep.js
          node tools/duplicate-sweep.js
          node tools/permissions-parity-check.cjs
