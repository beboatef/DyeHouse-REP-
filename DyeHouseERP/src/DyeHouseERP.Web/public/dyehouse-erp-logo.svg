<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" role="img" aria-label="DyeHouse ERP">
  <title>DyeHouse ERP</title>
  <defs>
    <clipPath id="drop">
      <path d="M60 10 C60 10 20 58 20 88 a40 40 0 0 0 80 0 C100 58 60 10 60 10 Z"/>
    </clipPath>
    <linearGradient id="erp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06B6D4"/>
      <stop offset="0.5" stop-color="#D946EF"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <style>
    :root { --ink:#0F172A; --sub:#64748B; }
    @media (prefers-color-scheme: dark) { :root { --ink:#F8FAFC; --sub:#94A3B8; } }
    .outline { fill:none; stroke:#0F172A; stroke-width:3; stroke-linejoin:round;
      stroke-dasharray:260; stroke-dashoffset:260; animation:draw 1.2s ease-out forwards; }
    @media (prefers-color-scheme: dark) { .outline { stroke:#F8FAFC; } }
    .fill { transform:translateY(90px); animation:rise 1.4s cubic-bezier(.2,.8,.2,1) .6s forwards; }
    .wave { animation:flow 3s linear infinite; }
    .w2 { animation-duration:4s; animation-direction:reverse; }
    .w3 { animation-duration:5s; }
    .shine { fill:#fff; opacity:0; animation:fadeIn .6s ease 1.6s forwards; }
    .t1 { opacity:0; transform:translateX(-14px); animation:slide .7s ease 1s forwards; }
    .t2 { opacity:0; transform:translateX(-14px); animation:slide .7s ease 1.2s forwards; }
    .t3 { opacity:0; animation:fadeInFull .8s ease 1.6s forwards; }
    @keyframes draw { to { stroke-dashoffset:0; } }
    @keyframes rise { to { transform:translateY(0); } }
    @keyframes flow { to { transform:translateX(80px); } }
    @keyframes slide { to { opacity:1; transform:translateX(0); } }
    @keyframes fadeIn { to { opacity:.35; } }
    @keyframes fadeInFull { to { opacity:1; } }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; opacity:1 !important; transform:none !important; stroke-dashoffset:0 !important; } .shine{opacity:.35 !important} }
  </style>

  <g clip-path="url(#drop)">
    <g class="fill">
      <g class="wave w3"><path d="M-80 52 q20 -12 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 V140 H-80 Z" fill="#06B6D4"/></g>
      <g class="wave w2"><path d="M-80 70 q20 -12 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 V140 H-80 Z" fill="#D946EF"/></g>
      <g class="wave"><path d="M-80 88 q20 -12 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 V140 H-80 Z" fill="#F59E0B"/></g>
    </g>
    <ellipse class="shine" cx="42" cy="78" rx="6" ry="16" transform="rotate(18 42 78)"/>
  </g>
  <path class="outline" d="M60 10 C60 10 20 58 20 88 a40 40 0 0 0 80 0 C100 58 60 10 60 10 Z"/>

  <text class="t1" x="125" y="78" font-family="'Poppins','Segoe UI',Arial,sans-serif" font-size="46" font-weight="700" fill="var(--ink)">Dye<tspan font-weight="300">House</tspan></text>
  <text class="t2" x="127" y="112" font-family="'Poppins','Segoe UI',Arial,sans-serif" font-size="30" font-weight="800" letter-spacing="8" fill="url(#erp)">ERP</text>
  <text class="t3" x="232" y="111" font-family="'Poppins','Segoe UI',Arial,sans-serif" font-size="11" letter-spacing="2" fill="var(--sub)">TEXTILE DYEING &amp; FINISHING</text>
</svg>
