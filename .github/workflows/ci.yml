name: ERP CI

# The repository's verification story:
#   frontend    - typecheck, lint, production build, i18n key parity and the structural sweeps in tools/;
#   backend     - Release build + the domain tests (no database needed);
#   integration - the API suite against a real SQL Server, because the numbering engine uses
#                 sp_getapplock and has no in-memory equivalent.
on:
  # Every pull request runs the full verification, whatever branch it targets.
  pull_request:
  push:
    branches: [main, "codex/**", "feat/**"]
  # Nightly drift check: the same integration job re-runs even with no PR open.
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DyeHouseERP/src/DyeHouseERP.Web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: DyeHouseERP/src/DyeHouseERP.Web/package-lock.json
      # `npm ci` (never `npm install`): the lockfile is the contract, and a drifted tree must fail here.
      - name: Install dependencies
        run: npm ci
      - name: Typecheck frontend
        run: npx tsc -b
      - name: Build frontend
        run: npm run build
      - name: Lint frontend
        run: npm run lint
      - name: i18n key parity
        # The checker and the sweeps read the repository from its root and reuse the
        # frontend's typescript package, so they run from DyeHouseERP/, not from the web app.
        working-directory: DyeHouseERP
        run: node tools/i18n-parity-check.cjs
      - name: Structural sweeps
        working-directory: DyeHouseERP
        run: |
          node tools/hooks-check.js
          node tools/wiring-sweep.js
          node tools/duplicate-sweep.js
          node tools/permissions-parity-check.cjs

      # The only check that actually RUNS the built app: it catches a crash on mount, an invalid hook
      # call, an unstyled white screen or a route that resolves to nothing - none of which typechecking
      # or linting can see. It needs a real browser, so Chrome for Testing is downloaded on demand
      # here instead of being declared a dependency (that would make every `npm ci` pull ~150 MB).
      - name: Install the browser for the UI smoke test
        env:
          PUPPETEER_CACHE_DIR: ${{ github.workspace }}/DyeHouseERP/tools/.puppeteer/browsers
        run: |
          npm run smoke:install
          # Chrome for Testing needs the same shared libraries Chrome itself does. Asking puppeteer
          # for them keeps the package list out of this file; the runner image usually already has
          # them, in which case apt changes nothing.
          # Best effort: the runner image ships Chrome's libraries already, so a missing apt package
          # must not fail the job here. If a library really is missing, the smoke step below fails
          # with the exact command that fixes it.
          sudo env "PATH=$PATH" "PUPPETEER_CACHE_DIR=$PUPPETEER_CACHE_DIR" \
            "$(command -v npx)" --prefix ../../tools/.puppeteer puppeteer browsers install chrome --install-deps \
            || echo "::warning::Chrome's system libraries could not be installed; using the image's own"

      - name: UI smoke test against the production build
        env:
          # `vite preview` serves the dist/ the build step just produced, with the same SPA fallback
          # a deployed host needs, so a deep link such as /warehouse loads the app a user would get.
          SMOKE_BASE: http://127.0.0.1:4173
          PUPPETEER_CACHE_DIR: ${{ github.workspace }}/DyeHouseERP/tools/.puppeteer/browsers
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          preview=$!
          trap 'kill "$preview" 2>/dev/null || true' EXIT

          # A readiness poll, not a fixed sleep: the server is up when it ANSWERS, and a preview that
          # never came up fails here with its own log instead of as a browser timeout.
          for _ in $(seq 1 30); do
            if curl -fsS "$SMOKE_BASE/login" > /dev/null; then break; fi
            sleep 1
          done
          if ! curl -fsS "$SMOKE_BASE/login" > /dev/null; then
            echo "vite preview never answered on $SMOKE_BASE"
            cat /tmp/preview.log
            exit 1
          fi

          npm run smoke

  backend:
    name: .NET 9 unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.318
      - name: Restore solution
        run: dotnet restore DyeHouseERP/DyeHouseERP.sln
      - name: Build solution (Release)
        run: dotnet build DyeHouseERP/DyeHouseERP.sln --configuration Release --no-restore
      - name: Run unit tests
        run: dotnet test DyeHouseERP/tests/DyeHouseERP.UnitTests/DyeHouseERP.UnitTests.csproj --configuration Release --no-build --no-restore

  integration:
    name: Integration tests (real SQL Server)
    runs-on: ubuntu-latest
    services:
      sqlserver:
        # Pinned (never `:latest`): a floating tag once moved the engine under a
        # green build and broke date handling. Bump deliberately, not silently.
        image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
        env:
          ACCEPT_EULA: "Y"
          # Protects a throwaway container that lives for one CI job; it is not a deployment
          # credential and nothing outside this file uses it.
          MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      # The suite DROPS and recreates this database per test class: never point it at real data.
      DYEHOUSE_TEST_CONNECTION: "Server=127.0.0.1,1433;Database=DyeHouseERP_IntegrationTests;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;Connect Timeout=30;"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.318
      - name: Wait for SQL Server
        # The runner starts the step as soon as the container is running, not when it is ready: the
        # port opens first and the engine accepts logins a little later. Bounded: if the port never
        # opens, the job fails here instead of timing out inside the test run.
        run: |
          ready=0
          for _ in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/1433) 2>/dev/null; then
              echo "SQL Server port 1433 is open"
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "SQL Server never opened port 1433 within the wait budget"
            exit 1
          fi
          sleep 20
      - name: Integration tests
        run: >-
          dotnet test DyeHouseERP/tests/DyeHouseERP.IntegrationTests/DyeHouseERP.IntegrationTests.csproj
          --configuration Release --nologo
          --logger "trx;LogFileName=integration.trx"
          --results-directory DyeHouseERP/tests/DyeHouseERP.IntegrationTests/TestResults
      - name: Publish TRX results
        # Always runs: a red test run must still publish its evidence.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-trx
          path: DyeHouseERP/tests/DyeHouseERP.IntegrationTests/TestResults/*.trx
          if-no-files-found: error
      - name: Test-results summary (fails on zero executed tests)
        # Guards against a silent skip: a run that executes nothing (bad filter,
        # missing connection string, crashed host) must be red, not green.
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, sys, xml.etree.ElementTree as ET
          files = glob.glob('DyeHouseERP/tests/DyeHouseERP.IntegrationTests/TestResults/*.trx')
          if not files:
              print('No TRX file was produced - the test run never reported.')
              sys.exit(1)
          executed = 0
          for f in files:
              ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
              for r in ET.parse(f).getroot().iter('{http://microsoft.com/schemas/VisualStudio/TeamTest/2010}UnitTestResult'):
                  if r.get('outcome') != 'NotExecuted':
                      executed += 1
          print(f'Executed tests: {executed} (across {len(files)} TRX file(s))')
          if executed == 0:
              print('Zero tests executed - treating the run as failed.')
              sys.exit(1)
          EOF

  backup-drill:
    name: Backup and restore drill
    runs-on: ubuntu-latest
    services:
      sqlserver:
        # Pinned, same policy as the integration job above.
        image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
        env:
          ACCEPT_EULA: "Y"
          # Protects a throwaway container that lives for one CI job; it is not a deployment
          # credential and nothing outside this file uses it.
          MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      # The drill database is created by the seed test run below, backed up, restored into
      # *_restoretest and verified. The scratch copy is retained for the last step, which
      # recomputes balances through the application against the restored data.
      DYEHOUSE_TEST_CONNECTION: "Server=127.0.0.1,1433;Database=DyeHouseERP_Drill;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;Connect Timeout=30;"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.318
      - name: Install sqlcmd
        env:
          ACCEPT_EULA: "Y"
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Register the Microsoft prod repo on a keyring this job owns. The
          # runner image already ships Microsoft keys/repos for .NET and the
          # Azure CLI, so writing to a shared keyring path trips gpg's
          # "File exists" refusal, and Ubuntu 24.04 (ubuntu-latest) rejects an
          # unsigned repo. A dedicated keyring plus an explicit signed-by line
          # (the variant Microsoft documents) works on both 22.04 and 24.04.
          KEYRING=/usr/share/keyrings/dyehouse-mssql.gpg
          LIST=/etc/apt/sources.list.d/dyehouse-mssql.list
          sudo rm -f "$KEYRING"
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
            | sudo gpg --batch --yes --dearmor -o "$KEYRING"
          source /etc/os-release
          echo "deb [arch=amd64 signed-by=$KEYRING] https://packages.microsoft.com/ubuntu/${VERSION_ID}/prod ${VERSION_CODENAME} main" \
            | sudo tee "$LIST" > /dev/null
          sudo apt-get update
          sudo env ACCEPT_EULA=Y DEBIAN_FRONTEND=noninteractive apt-get install -y mssql-tools18
          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"
          # Fail here, with a clear message, if the tools did not land.
          /opt/mssql-tools18/bin/sqlcmd -? > /dev/null
      - name: Wait for SQL Server
        run: |
          ready=0
          for _ in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/1433) 2>/dev/null; then
              echo "SQL Server port 1433 is open"
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "SQL Server never opened port 1433 within the wait budget"
            exit 1
          fi
          sleep 20
      - name: Seed the drill database with real postings
        # FullHappyPathTests posts a receipt -> production -> delivery -> invoice -> receipt,
        # so the drill database holds real ledger rows to reconcile (not an empty schema).
        run: >-
          dotnet test DyeHouseERP/tests/DyeHouseERP.IntegrationTests/DyeHouseERP.IntegrationTests.csproj
          --filter "FullyQualifiedName~FullHappyPathTests" --nologo
      - name: Back up the drill database
        env:
          DYEHOUSE_BACKUP_PASSWORD: "YourStrong!Passw0rd"
        run: |
          chmod +x DyeHouseERP/tools/backup/*.sh
          DyeHouseERP/tools/backup/backup-dyehouse.sh \
            --server 127.0.0.1 --user sa --password-env DYEHOUSE_BACKUP_PASSWORD \
            --database DyeHouseERP_Drill --backup-dir /var/opt/mssql \
            --path-separator "/" --backup-name drill-latest.bak --allow-db DyeHouseERP_Drill
      - name: Restore into scratch and verify
        env:
          DYEHOUSE_BACKUP_PASSWORD: "YourStrong!Passw0rd"
          DYEHOUSE_RESTORE_ALLOW_DBS: "DyeHouseERP_Drill"
        run: |
          DyeHouseERP/tools/backup/restore-verify.sh \
            --server 127.0.0.1 --user sa --password-env DYEHOUSE_BACKUP_PASSWORD \
            --source-db DyeHouseERP_Drill \
            --backup-file /var/opt/mssql/drill-latest.bak \
            --scratch-db DyeHouseERP_Drill_restoretest \
            --report drill-report.txt --path-separator "/" --data-dir /var/opt/mssql \
            --keep-scratch
          cat drill-report.txt
      - name: Recompute balances on the restored copy
        env:
          DYEHOUSE_RESTOREREVERIFY_CONNECTION: "Server=127.0.0.1,1433;Database=DyeHouseERP_Drill_restoretest;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;Connect Timeout=30;"
        run: >-
          dotnet test DyeHouseERP/tests/DyeHouseERP.IntegrationTests/DyeHouseERP.IntegrationTests.csproj
          --filter "FullyQualifiedName~BackupRestoreVerificationTests" --nologo
      - name: Drop the drill scratch database
        # The drill keeps the restored copy (--keep-scratch) so the step above can
        # read it; this always runs to leave no scratch database behind, whether or
        # not the recompute passed. The name guard is repeated here so this step can
        # never drop anything but a *_restoretest database.
        if: always()
        env:
          DYEHOUSE_BACKUP_PASSWORD: "YourStrong!Passw0rd"
        run: |
          if ! command -v sqlcmd >/dev/null 2>&1; then
            echo "sqlcmd is unavailable (the install step failed); nothing to clean up."
            exit 0
          fi
          sqlcmd -S 127.0.0.1 -U sa -P "$DYEHOUSE_BACKUP_PASSWORD" -C -b -d master -Q "
            IF DB_ID(N'DyeHouseERP_Drill_restoretest') IS NOT NULL
               AND RIGHT(N'DyeHouseERP_Drill_restoretest', 12) = N'_restoretest'
            BEGIN
                ALTER DATABASE [DyeHouseERP_Drill_restoretest] SET SINGLE_USER WITH ROLLBACK IMMEDIATE;
                DROP DATABASE [DyeHouseERP_Drill_restoretest];
                PRINT 'Dropped DyeHouseERP_Drill_restoretest';
            END
            ELSE
                PRINT 'DyeHouseERP_Drill_restoretest not present; nothing to drop.';
          "
